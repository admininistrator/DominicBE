services:
  postgres:
    image: postgres:16-alpine
    container_name: dominic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: dominic
      POSTGRES_PASSWORD: dominic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominic -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: dominic-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: dominic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: minio/mc:latest
    container_name: dominic-minio-bootstrap
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123; do
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/dominic-knowledge;
      /usr/bin/mc anonymous set none local/dominic-knowledge;
      exit 0;
      "

volumes:
  postgres_data:
  qdrant_data:
  minio_data: