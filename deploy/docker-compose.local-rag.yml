name: Dominic Local

services:
  postgres:
    image: postgres:16-alpine
    container_name: dominic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: dominic
      POSTGRES_PASSWORD: dominic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominic -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: dominic-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: dominic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: minio/mc:latest
    container_name: dominic-minio-bootstrap
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123; do
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/dominic-knowledge;
      /usr/bin/mc anonymous set none local/dominic-knowledge;
      exit 0;
      "

  rag-core:
    build:
      context: ../../rag-core
      dockerfile: Dockerfile
    container_name: dominic-rag-core
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    environment:
      RAG_CORE_API_KEY: local-rag-core-dev-key
      RAG_CORE_HOST: 0.0.0.0
      RAG_CORE_PORT: 8010
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: local-hash-v1
      EMBEDDING_DIMENSIONS: 64
      VECTOR_STORE_PROVIDER: qdrant
      VECTOR_STORE_URL: http://qdrant:6333
      VECTOR_STORE_COLLECTION: knowledge_chunks
    ports:
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
