services:
  redis:
    image: redis:7.2-alpine
    container_name: dominic-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >-
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis_dev_password}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  celery-worker:
    build:
      context: ../..
      dockerfile: DominicBE/Dockerfile
    image: dominic-backend:local
    container_name: dominic-celery-worker
    restart: unless-stopped
    entrypoint: []
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery,ingestion"]
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
      AUTH_SECRET_KEY: change-this-in-production
      DATABASE_URL: postgresql+psycopg://dominic:dominic_dev_password@postgres:5432/chatbot_db
      CELERY_ENABLED: "true"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/1
      RUN_MIGRATIONS: "0"
      WAIT_FOR_DATABASE: "0"
      RAG_CORE_MODE: api
      RAG_CORE_BASE_URL: http://rag-core:8010
      RAG_CORE_API_KEY: local-rag-core-dev-key
      RAG_CORE_TIMEOUT_SECONDS: "60"
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL: local-hash-v1
      EMBEDDING_DIMENSIONS: "64"
      VECTOR_STORE_PROVIDER: qdrant
      VECTOR_STORE_URL: http://qdrant:6333
      VECTOR_STORE_COLLECTION: knowledge_chunks
      VECTOR_STORE_PREFER_GRPC: "false"
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_BUCKET: dominic-knowledge
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin123
      OBJECT_STORAGE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      minio-bootstrap:
        condition: service_completed_successfully
      rag-core:
        condition: service_healthy

volumes:
  redis_data:
